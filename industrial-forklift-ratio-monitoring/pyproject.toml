[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forklift-monitoring"
version = "0.1.0"
description = "UWB-first forklift path counting with vision-assisted tracking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "pyyaml",
  "opencv-python",
  "pyserial",
  "ultralytics",
]

[project.scripts]
forklift-demo-uwb = "forklift_monitoring.app.demo_uwb:main"
forklift-demo-camera = "forklift_monitoring.app.demo_camera:main"
forklift-realtime-uwb = "forklift_monitoring.app.realtime_uwb:main"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
