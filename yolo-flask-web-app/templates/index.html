<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>河蟹AI病害诊断Demo</title>
</head>
<body>
  <h2>河蟹AI病害诊断Demo</h2>

  <form id="chat-form" enctype="multipart/form-data">
    <p>会话 ID: <input type="text" name="session_id" value="demo-session"></p>
    <p>问题: <input type="text" name="text" size="60"></p>
    <p>选择图片: <input type="file" name="image"></p>
    <p><button type="submit">提交</button></p>
  </form>

  <h3>对话历史</h3>
  <div id="chat-log" style="white-space: pre-wrap; border: 1px solid #aaa; padding: 10px; width: 80%; height: 400px; overflow-y: auto;"></div>

  <script>
    const form = document.getElementById("chat-form");
    const chatLog = document.getElementById("chat-log");

    form.onsubmit = async function(e) {
      e.preventDefault();

      let formData = new FormData(form);

      let response = await fetch("/chat", {
        method: "POST",
        body: formData
      });

      let data = await response.json();

      // 清空聊天框
      chatLog.innerHTML = "";

      // 遍历 session_messages 显示
      for (let msg of data.session_messages) {
        let role = msg.role;
        let content_html = "";

        if (msg.content) {
          for (let c of msg.content) {
            if (c.type === "text" && c.text) {
              content_html += c.text + "<br>";
            } else if (c.type === "image_url") {
              content_html += `<img src="${c.image_url.url}" style="max-width:200px"><br>`;
            }
          }
        }

        chatLog.innerHTML += `<b>${role}:</b><br>${content_html}<br>`;
      }

      // 滚动到底部
      chatLog.scrollTop = chatLog.scrollHeight;
    };
  </script>
</body>
</html>
