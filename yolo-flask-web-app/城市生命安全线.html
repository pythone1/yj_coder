<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城市生命线智能体系统 - 专业汇报版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
    <style>
        :root {
            --sidebar-bg: #0f172a;
            --active-blue: #3b82f6;
            --tech-green: #10b981;
            --alert-red: #ef4444;
        }
        body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #f8fafc; overflow: hidden; }

        /* 滚动条美化 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        /* 导航交互 */
        .nav-item { transition: all 0.2s ease-in-out; border-left: 3px solid transparent; }
        .nav-item:hover { background: rgba(255,255,255,0.08); }
        .nav-item.active { background: rgba(59, 130, 246, 0.15); border-left-color: var(--active-blue); color: #fff; }

        /* 智能体卡片 - 布局优化 */
        .agent-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 240px; /* 保证卡片有足够高度展示内容 */
        }
        .agent-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.15); border-color: #60a5fa; }
        .agent-card::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: transparent; transition: background 0.3s; }
        .agent-card:hover::after { background: #3b82f6; }

        /* 模态框动画 */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px); z-index: 50; align-items: center; justify-content: center;
        }
        .modal-overlay.show { display: flex; animation: fadeIn 0.2s ease-out; }

        /* 终端日志样式 */
        .sim-console { font-family: 'JetBrains Mono', 'Menlo', 'Consolas', monospace; font-size: 11px; line-height: 1.5; }
        .log-entry { margin-bottom: 3px; border-left: 2px solid transparent; padding-left: 6px; animation: slideLeft 0.3s; }

        /* 聊天气泡 */
        .chat-bubble { max-width: 85%; padding: 8px 12px; border-radius: 8px; margin-bottom: 10px; font-size: 13px; position: relative; animation: popIn 0.3s; box-shadow: 0 1px 2px rgba(0,0,0,0.05); line-height: 1.5; }
        .chat-user { background: #eff6ff; color: #1e40af; align-self: flex-end; border-bottom-right-radius: 2px; }
        .chat-ai { background: #fff; color: #334155; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #e2e8f0; }

        /* Markdown */
        .markdown-body { font-size: 13px; line-height: 1.6; color: #334155; }
        .markdown-body h1, .markdown-body h2 { font-weight: bold; margin-top: 1em; margin-bottom: 0.5em; color: #0f172a; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.5em; }
        .markdown-body strong { color: #2563eb; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes slideLeft { from { transform: translateX(-10px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body class="flex h-screen w-screen text-slate-800 bg-slate-100">

    <!-- 左侧导航 -->
    <aside class="w-64 bg-slate-900 text-slate-400 flex flex-col shadow-2xl z-20 shrink-0 h-full">
        <div class="h-16 flex items-center px-5 border-b border-slate-800 bg-slate-950 shrink-0">
            <div class="w-8 h-8 rounded bg-gradient-to-br from-blue-600 to-indigo-600 flex items-center justify-center text-white font-bold mr-3 shadow-lg shadow-blue-900/40 text-xs">AI</div>
            <span class="font-bold text-slate-100 tracking-wide text-sm">城市生命线</span>
        </div>

        <nav class="flex-1 py-4 space-y-1 overflow-y-auto">
            <div class="px-5 mb-2 text-[10px] font-bold text-slate-500 uppercase tracking-widest">核心业务模块</div>
            <button onclick="app.loadModule('perception')" id="nav-perception" class="nav-item w-full flex items-center px-5 py-3 text-sm font-medium hover:text-white">
                <span class="mr-3 text-lg">📡</span> 感知与预警
            </button>
            <button onclick="app.loadModule('decision')" id="nav-decision" class="nav-item w-full flex items-center px-5 py-3 text-sm font-medium hover:text-white">
                <span class="mr-3 text-lg">🧠</span> 调度与决策
            </button>
            <button onclick="app.loadModule('operation')" id="nav-operation" class="nav-item w-full flex items-center px-5 py-3 text-sm font-medium hover:text-white">
                <span class="mr-3 text-lg">🛠️</span> 运维与规划
            </button>

            <div class="px-5 mt-6 mb-2 text-[10px] font-bold text-slate-500 uppercase tracking-widest">智能服务</div>
            <button onclick="app.loadAdvisor()" id="nav-advisor" class="nav-item w-full flex items-center px-5 py-3 text-sm font-medium text-indigo-400 hover:text-indigo-300 hover:bg-indigo-900/20">
                <span class="mr-3 text-lg">🤖</span> 生命线智能顾问
            </button>
        </nav>

        <div class="p-4 border-t border-slate-800 bg-slate-950/30 shrink-0">
            <div class="flex items-center gap-2 mb-1">
                <span class="relative flex h-2 w-2">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                <span class="text-xs text-emerald-400 font-mono font-medium">System Online</span>
            </div>
            <div class="text-[10px] text-slate-600 font-mono">Build 20240520.RC6</div>
        </div>
    </aside>

    <!-- 主内容区 -->
    <main class="flex-1 flex flex-col relative overflow-hidden h-full min-w-0">
        <header class="h-14 bg-white border-b border-slate-200 flex items-center justify-between px-6 shadow-sm shrink-0 z-10">
            <div>
                <h1 id="module-title" class="text-base font-bold text-slate-800 tracking-tight">模块名称</h1>
                <p id="module-desc" class="text-[10px] text-slate-500 hidden sm:block">模块描述信息...</p>
            </div>
            <div class="text-right">
                <div class="text-[10px] text-slate-400 uppercase font-bold">Agents</div>
                <div id="agent-count" class="text-base font-bold text-slate-700 leading-none">0</div>
            </div>
        </header>

        <!-- 内容容器：Grid 布局 -->
        <div id="content-area" class="flex-1 overflow-y-auto p-4 sm:p-6 bg-slate-50">
            <!-- 默认展示智能体卡片列表 -->
            <div id="agent-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 pb-10">
                <!-- 动态生成 -->
            </div>

            <!-- 智能顾问界面 (默认隐藏) -->
            <div id="advisor-view" class="hidden h-full flex flex-col max-w-4xl mx-auto bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-4 border-b border-slate-100 bg-slate-50/50 flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center text-xl">🤖</div>
                    <div>
                        <h3 class="font-bold text-slate-800">生命线智能顾问 (Smart Advisor)</h3>
                        <p class="text-xs text-slate-500">接入垂直领域知识库，为您解答城市生命线安全问题</p>
                    </div>
                </div>
                <div id="advisor-chat-box" class="flex-1 overflow-y-auto p-6 space-y-4 bg-slate-50/30">
                    <div class="chat-bubble chat-ai">
                        你好！我是城市生命线智能顾问。我可以协助您进行风险研判、应急预案查询或解释相关技术指标。<br>请问有什么可以帮您？
                    </div>
                </div>
                <div class="p-4 border-t border-slate-100 bg-white">
                    <form onsubmit="app.handleAdvisorSubmit(event)" class="flex gap-3">
                        <input type="text" id="advisor-input" class="flex-1 border border-slate-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" placeholder="请输入您的问题，例如：暴雨导致低洼积水如何处置？...">
                        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg text-sm font-bold transition">发送</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- 演示控制台 (Command Center) -->
    <div id="sim-modal" class="modal-overlay p-4">
        <div class="bg-white rounded-lg shadow-2xl w-full max-w-5xl h-[85vh] flex flex-col overflow-hidden border border-slate-600 animate-in fade-in zoom-in duration-300 relative">

            <!-- AI 报告层 -->
            <div id="ai-report-layer" class="absolute inset-0 bg-white/95 backdrop-blur-sm z-50 hidden flex-col">
                <div class="h-12 flex items-center justify-between px-6 border-b border-slate-100 bg-white shrink-0">
                    <div class="flex items-center gap-2 text-blue-600">
                        <span class="text-lg">✨</span>
                        <h3 class="font-bold text-sm">智能研判报告</h3>
                    </div>
                    <button onclick="document.getElementById('ai-report-layer').classList.add('hidden')" class="text-slate-400 hover:text-slate-700 text-2xl">&times;</button>
                </div>
                <div id="ai-report-content" class="flex-1 overflow-y-auto p-8 markdown-body"></div>
            </div>

            <!-- Header -->
            <div class="h-12 bg-slate-900 text-white flex items-center justify-between px-4 shrink-0">
                <div class="flex items-center gap-3">
                    <span id="modal-icon" class="text-lg">⚡</span>
                    <div>
                        <span id="modal-title" class="font-bold text-sm tracking-wide text-slate-100">演示窗口</span>
                        <p class="text-[10px] text-slate-400 uppercase">Real-time Simulation</p>
                    </div>
                </div>
                <button onclick="sim.close()" class="text-slate-400 hover:text-white text-2xl leading-none">&times;</button>
            </div>

            <!-- Body -->
            <div class="flex-1 flex overflow-hidden flex-col md:flex-row">
                <!-- Left: Viz -->
                <div class="flex-1 bg-slate-100 p-3 flex flex-col relative min-h-[300px]">
                    <div id="viz-container" class="flex-1 bg-slate-900 rounded border border-slate-300 shadow-inner relative overflow-hidden flex items-center justify-center">
                        <canvas id="sim-canvas" class="w-full h-full block"></canvas>
                        <!-- HTML Overlay for Chat/Web content -->
                        <div id="html-overlay" class="absolute inset-0 bg-slate-50 p-4 hidden flex flex-col overflow-y-auto"></div>
                        <!-- Chart Container for Chart.js -->
                        <div id="chart-container" class="absolute inset-0 hidden bg-white p-4 flex flex-col h-full w-full">
                            <canvas id="chart-canvas"></canvas>
                        </div>
                        <!-- Controls Overlay for buttons inside visualization -->
                        <div id="controls-overlay" class="absolute bottom-4 left-0 w-full flex justify-center gap-4 pointer-events-auto hidden z-20"></div>
                    </div>

                    <!-- Controls Bar -->
                    <div class="mt-3 h-10 bg-white rounded border border-slate-200 flex items-center px-4 justify-between shadow-sm shrink-0">
                        <div class="flex items-center gap-3 text-xs">
                            <span class="w-2 h-2 rounded-full bg-slate-300" id="status-dot"></span>
                            <span id="sim-status-text" class="text-slate-600 font-bold">就绪</span>
                        </div>
                        <div class="flex gap-2">
                            <button id="btn-ai-report" onclick="sim.generateReport()" class="hidden bg-indigo-500 hover:bg-indigo-600 text-white text-xs font-bold px-3 py-1.5 rounded transition items-center gap-1">
                                ✨ 分析报告
                            </button>
                            <button id="btn-start" onclick="sim.run()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-1.5 rounded transition flex items-center gap-1">
                                ▶ 启动演示
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Right: Data -->
                <div class="w-full md:w-64 bg-white border-l border-slate-200 flex flex-col shrink-0 h-1/3 md:h-auto border-t md:border-t-0">
                    <div class="p-3 border-b border-slate-100 bg-slate-50/50">
                        <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">实时感知数据</h4>
                        <div id="data-panel" class="space-y-1 font-mono text-xs overflow-y-auto max-h-[120px] md:max-h-none">
                            <div class="text-slate-300 italic text-center py-2">等待数据接入...</div>
                        </div>
                    </div>
                    <div class="flex-1 bg-[#1e1e1e] p-3 overflow-y-auto sim-console text-slate-300 flex flex-col" id="log-panel">
                        <div class="text-slate-500"># 终端就绪...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const apiKey = "";
        const md = window.markdownit();

        // --- 业务数据 ---
        const DB = {
            perception: {
                title: "感知与预警模块",
                desc: "构建全域敏感的“城市神经末梢”，实时监测。",
                agents: [
                    {
                        id: "a01",
                        name: "短时洪水预报智能体",
                        icon: "⛈️",
                        data: "X波段雷达 / 雨量站",
                        algo: "时空图神经网络 (ST-GNN)",
                        value: "实现分钟级、网格化精准预报，将传统洪水预演速度提升60倍。",
                        market: "市水务局、防汛办",
                        type: "flood"
                    },
                    {
                        id: "a02",
                        name: "管网听诊智能体",
                        icon: "🩺",
                        data: "声学传感器 / 流量 / 液位",
                        algo: "多维特征融合 + 孤立森林",
                        value: "精准定位微小暗漏，降低产销差(NRW)，防止地面塌陷。",
                        market: "水务集团、排水公司",
                        type: "leak"
                    },
                    {
                        id: "a07",
                        name: "遥感天眼智能体",
                        icon: "🛰️",
                        data: "高分卫星 / DEM / NDVI",
                        algo: "语义分割 + 规则推理",
                        value: "自动识别“植被破坏+低洼”风险组合，预测潜在积水点。",
                        market: "规划资源局",
                        type: "remote"
                    },
                    {
                        id: "a08",
                        name: "社会感知智能体",
                        icon: "👥",
                        data: "市民工单 / 社交媒体",
                        algo: "多模态大模型 (UrbanLLaVA)",
                        value: "将市民转化为移动传感器，填补盲区，提升响应速度。",
                        market: "应急局",
                        type: "social"
                    }
                ]
            },
            decision: {
                title: "调度与决策模块",
                desc: "负责全盘推演与资源最优调度。",
                agents: [
                    {
                        id: "a03",
                        name: "孪生推演智能体",
                        icon: "🎲",
                        data: "城市CIM模型 / 管网拓扑",
                        algo: "物理信息神经网络 (PINN)",
                        value: "结合地上城市模型与地下管网，全要素验证防汛预案。",
                        market: "设计院、水务集团",
                        type: "twin"
                    },
                    {
                        id: "a06",
                        name: "应急指挥智能体",
                        icon: "🚓",
                        data: "积水风险图 / 救援力量",
                        algo: "多智能体强化学习 (MARL)",
                        value: "动态规避高风险路段，生成最优救援路径。",
                        market: "应急局、交警",
                        type: "dispatch"
                    },
                    {
                        id: "a09",
                        name: "协同治理智能体",
                        icon: "🤝",
                        data: "跨部门业务流 / 权责清单",
                        algo: "思维链 (CoT) + 知识图谱",
                        value: "自动拆解复杂事件，生成跨部门联合处置方案。",
                        market: "大数据局、IOC",
                        type: "collab"
                    }
                ]
            },
            operation: {
                title: "运维与规划模块",
                desc: "赋予基础设施“自愈”能力。",
                agents: [
                    {
                        id: "a04",
                        name: "能效控制智能体",
                        icon: "⚡",
                        data: "泵站电耗 / 峰谷电价",
                        algo: "深度强化学习 (PPO)",
                        value: "多模式智能切换，保障安全前提下能耗最优。",
                        market: "排水公司",
                        type: "energy"
                    },
                    {
                        id: "a05",
                        name: "机器运维智能体",
                        icon: "🤖",
                        data: "CCTV视频流 / 声纳",
                        algo: "YOLOv8 + 缺陷定级",
                        value: "自动化识别管道缺陷，生成健康评估报告。",
                        market: "检测公司",
                        type: "robot"
                    }
                ]
            }
        };

        // --- 应用逻辑 ---
        const app = {
            currentModule: null,
            init() { this.loadModule('perception'); },

            loadModule(moduleKey) {
                document.getElementById('agent-grid').classList.remove('hidden');
                document.getElementById('advisor-view').classList.add('hidden');
                document.getElementById('content-area').scrollTop = 0;

                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                const navBtn = document.getElementById('nav-' + moduleKey);
                if(navBtn) navBtn.classList.add('active');

                const data = DB[moduleKey];
                this.currentModule = data;
                document.getElementById('module-title').innerText = data.title;
                document.getElementById('module-desc').innerText = data.desc;
                document.getElementById('agent-count').innerText = data.agents.length;

                const container = document.getElementById('agent-grid');
                container.innerHTML = '';

                data.agents.forEach(agent => {
                    const card = document.createElement('div');
                    card.className = "agent-card bg-white rounded-xl border border-slate-200 p-5";

                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-start mb-3">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-lg bg-slate-50 border border-slate-100 flex items-center justify-center text-2xl shadow-sm shrink-0">${agent.icon}</div>
                                    <div class="min-w-0">
                                        <h3 class="font-bold text-slate-800 text-sm truncate pr-2" title="${agent.name}">${agent.name}</h3>
                                        <div class="flex gap-2 mt-0.5">
                                            <span class="text-[10px] bg-blue-50 text-blue-600 px-1.5 py-0.5 rounded border border-blue-100 font-mono">ID: ${agent.id.toUpperCase()}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="space-y-2 text-xs">
                                <div class="bg-slate-50 p-2 rounded border border-slate-100/50">
                                    <span class="block text-slate-400 font-bold scale-90 origin-left mb-0.5">INPUT DATA</span>
                                    <span class="text-slate-600 font-medium line-clamp-1" title="${agent.data}">${agent.data}</span>
                                </div>
                                <div class="bg-slate-50 p-2 rounded border border-slate-100/50">
                                    <span class="block text-slate-400 font-bold scale-90 origin-left mb-0.5">ALGORITHM</span>
                                    <span class="text-blue-600 font-bold font-mono line-clamp-1" title="${agent.algo}">${agent.algo}</span>
                                </div>
                                <p class="text-slate-500 leading-relaxed pt-1 h-10 overflow-hidden text-ellipsis line-clamp-2" title="${agent.value}">${agent.value}</p>
                            </div>
                        </div>

                        <button onclick="sim.open('${moduleKey}', '${agent.id}')" class="mt-4 w-full bg-slate-900 hover:bg-blue-600 text-white py-2 rounded-lg text-xs font-bold transition flex items-center justify-center gap-2 group">
                            <span>启动演示场景</span>
                            <span class="group-hover:translate-x-1 transition-transform">→</span>
                        </button>
                    `;
                    container.appendChild(card);
                });
            },

            loadAdvisor() {
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                document.getElementById('nav-advisor').classList.add('active');

                document.getElementById('module-title').innerText = "智能顾问中心";
                document.getElementById('module-desc').innerText = "AI 垂直领域问答服务";
                document.getElementById('agent-count').innerText = "AI";

                document.getElementById('agent-grid').classList.add('hidden');
                document.getElementById('advisor-view').classList.remove('hidden');
            },

            async handleAdvisorSubmit(e) {
                e.preventDefault();
                const input = document.getElementById('advisor-input');
                const box = document.getElementById('advisor-chat-box');
                const text = input.value.trim();
                if(!text) return;

                const userDiv = document.createElement('div');
                userDiv.className = "chat-bubble chat-user";
                userDiv.innerText = text;
                box.appendChild(userDiv);
                input.value = '';
                box.scrollTop = box.scrollHeight;

                const loadingDiv = document.createElement('div');
                loadingDiv.className = "chat-bubble chat-ai text-slate-400 italic";
                loadingDiv.innerText = "思考中...";
                box.appendChild(loadingDiv);
                box.scrollTop = box.scrollHeight;

                try {
                    const prompt = `你是一个专业的城市生命线安全专家。用户是城市管理者。请简明扼要地回答以下问题：${text}`;
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "抱歉，服务暂时繁忙。";

                    box.removeChild(loadingDiv);
                    const aiDiv = document.createElement('div');
                    aiDiv.className = "chat-bubble chat-ai";
                    aiDiv.innerHTML = md.render(reply);
                    box.appendChild(aiDiv);
                } catch(err) {
                    loadingDiv.innerText = "网络错误，请重试。";
                }
                box.scrollTop = box.scrollHeight;
            }
        };

        // --- 仿真引擎 ---
        const sim = {
            activeAgent: null,
            chartInstance: null,
            timer: null,
            frameId: null,
            ctx: null,
            width: 0,
            height: 0,
            logs: [],

            open(moduleKey, agentId) {
                const agent = DB[moduleKey].agents.find(a => a.id === agentId);
                this.activeAgent = agent;
                this.logs = [];

                document.getElementById('sim-modal').classList.add('show');
                document.getElementById('modal-title').innerText = agent.name;

                this.setStatus("系统就绪", "gray");
                document.getElementById('data-panel').innerHTML = '<div class="text-slate-400 italic py-4 text-center">等待数据流接入...</div>';
                document.getElementById('log-panel').innerHTML = '<div class="text-slate-500"># 终端就绪...</div>';
                document.getElementById('btn-ai-report').classList.add('hidden');
                document.getElementById('ai-report-layer').classList.add('hidden');
                document.getElementById('html-overlay').classList.add('hidden');
                document.getElementById('chart-container').classList.add('hidden');
                document.getElementById('controls-overlay').classList.add('hidden');

                const btn = document.getElementById('btn-start');
                btn.disabled = false;
                btn.innerHTML = '▶ 启动演示';
                btn.className = "bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-1.5 rounded transition";

                const canvas = document.getElementById('sim-canvas');
                canvas.classList.remove('hidden');
                const container = document.getElementById('viz-container');

                setTimeout(() => {
                    canvas.width = container.clientWidth;
                    canvas.height = container.clientHeight;
                    this.width = canvas.width;
                    this.height = canvas.height;
                    this.ctx = canvas.getContext('2d');
                    this.ctx.fillStyle = '#0f172a';
                    this.ctx.fillRect(0,0,this.width, this.height);
                    this.drawGrid();
                }, 50);
            },

            close() {
                document.getElementById('sim-modal').classList.remove('show');
                this.stop();
            },

            stop() {
                if(this.timer) clearInterval(this.timer);
                if(this.frameId) cancelAnimationFrame(this.frameId);
                if(this.chartInstance) { this.chartInstance.destroy(); this.chartInstance = null; }
            },

            log(msg, type='info') {
                const p = document.getElementById('log-panel');
                const t = new Date().toLocaleTimeString('zh-CN', {hour12:false});
                this.logs.push(`[${t}] ${msg}`);
                let c = "text-slate-300";
                if(type==='alert') c = "text-red-400 font-bold";
                if(type==='sys') c = "text-blue-400";
                const row = document.createElement('div');
                row.className = "log-entry " + c;
                row.innerHTML = `<span class="opacity-40 text-[10px] mr-2">${t}</span>${msg}`;
                p.appendChild(row);
                p.scrollTop = p.scrollHeight;
            },

            updateData(items) {
                document.getElementById('data-panel').innerHTML = items.map(i => `
                    <div class="flex justify-between items-center border-b border-slate-100/10 pb-1 mb-1 last:border-0">
                        <span class="text-slate-500">${i.label}</span>
                        <span class="font-bold text-slate-600 ${i.alert?'text-red-500':''}">${i.value}</span>
                    </div>
                `).join('');
            },

            setStatus(t, c) {
                document.getElementById('sim-status-text').innerText = t;
                const d = document.getElementById('status-dot');
                d.className = "w-2 h-2 rounded-full " + (c==='green'?'bg-emerald-500 animate-pulse': c==='red'?'bg-red-500 animate-ping':'bg-slate-300');
            },

            drawGrid() {
                const ctx = this.ctx;
                ctx.strokeStyle = 'rgba(255,255,255,0.05)';
                ctx.lineWidth = 1;
                for(let x=0; x<this.width; x+=40) { ctx.moveTo(x,0); ctx.lineTo(x,this.height); }
                for(let y=0; y<this.height; y+=40) { ctx.moveTo(0,y); ctx.lineTo(this.width,y); }
                ctx.stroke();
            },

            finishSimulation() {
                this.setStatus("演示结束", "green");
                const btn = document.getElementById('btn-start');
                btn.innerHTML = '✓ 完成';
                btn.disabled = true;
                btn.className = "bg-slate-400 text-white text-xs font-bold px-4 py-1.5 rounded cursor-default";
                document.getElementById('btn-ai-report').classList.remove('hidden');
                document.getElementById('btn-ai-report').classList.add('flex');
            },

            async generateReport() {
                const layer = document.getElementById('ai-report-layer');
                const content = document.getElementById('ai-report-content');
                layer.classList.remove('hidden');
                layer.classList.add('flex');
                content.innerHTML = '<div class="text-center text-slate-400 mt-20">正在生成报告...</div>';

                try {
                    const prompt = `基于以下仿真日志生成简报：\n${this.logs.join('\n')}\n请包含：1.态势总结 2.核心风险 3.处置建议。使用Markdown。`;
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST', body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await res.json();
                    content.innerHTML = md.render(data.candidates?.[0]?.content?.parts?.[0]?.text || "生成失败");
                } catch(e) { content.innerText = "Error"; }
            },

            run() {
                this.stop();
                const btn = document.getElementById('btn-start');
                document.getElementById('btn-ai-report').classList.add('hidden');
                btn.disabled = true;
                btn.innerHTML = '⟳ 运行中...';
                btn.className = "bg-slate-100 text-slate-400 text-xs font-bold px-4 py-1.5 rounded border border-slate-200 cursor-wait";

                const map = {
                    'flood': this.runFlood,
                    'leak': this.runLeak,
                    'remote': this.runRemote,
                    'social': this.runSocial,
                    'twin': this.runTwin,
                    'dispatch': this.runDispatch,
                    'collab': this.runCollab,
                    'energy': this.runEnergy,
                    'robot': this.runRobot
                };
                if(map[this.activeAgent.type]) map[this.activeAgent.type].call(this);
            },

            // --- 恢复详细的业务逻辑 ---

            // 1. 洪水预报 (Chart.js 三线对比)
            runFlood() {
                this.setStatus("数据接入中", "blue");
                this.log("接入气象局 X波段雷达数据...", "sys");
                this.log("获取流域冬季基础水位...", "sys");

                setTimeout(() => {
                    this.log("ST-GNN 模型初始化完成，开始推演...", "model");
                    const chartCanvas = document.getElementById('chart-canvas');
                    document.getElementById('sim-canvas').classList.add('hidden');
                    document.getElementById('chart-container').classList.remove('hidden');

                    const ctx = chartCanvas.getContext('2d');
                    const labels = Array.from({length: 24}, (_,i) => `${i}:00`);
                    const traditional = [], actual = [], ai_pred = [];

                    for(let i=0; i<24; i++) {
                        let base = 2.5;
                        let surge = 0;
                        if(i > 10 && i < 18) surge = Math.sin((i-10)/8 * Math.PI) * 3.5;
                        traditional.push(base + surge * 0.7);
                        actual.push(base + surge * 1.0 + (Math.random()*0.2));
                        ai_pred.push(base + surge * 1.02);
                    }

                    this.chartInstance = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [
                                { label: '实际观测', data: [], borderColor: '#10b981', backgroundColor: 'rgba(16, 185, 129, 0.1)', fill: true },
                                { label: 'AI预测', data: [], borderColor: '#3b82f6', borderDash: [5,5] },
                                { label: '传统模型', data: [], borderColor: '#94a3b8' }
                            ]
                        },
                        options: {
                            responsive: true, maintainAspectRatio: false, animation: false,
                            plugins: { title: { display: true, text: '24小时水位过程线 (冬季场景)' } },
                            scales: { y: { min: 0, title: {display:true, text: '水位 (m)'} } }
                        }
                    });

                    let step = 0;
                    this.timer = setInterval(() => {
                        if(step >= 24) { this.log("推演结束，AI精度优于传统35%。", "agent"); this.finishSimulation(); clearInterval(this.timer); return; }
                        this.chartInstance.data.datasets[0].data.push(actual[step]);
                        this.chartInstance.data.datasets[1].data.push(ai_pred[step]);
                        this.chartInstance.data.datasets[2].data.push(traditional[step]);
                        this.chartInstance.update();
                        this.updateData([{label:'雨量',value: step>10&&step<16?'25mm/h':'0'}, {label:'AI水位',value: ai_pred[step].toFixed(2)+'m', alert: ai_pred[step]>5}]);
                        if(step===12) this.log("水位快速上涨，修正参数...", "agent");
                        step++;
                    }, 200);
                }, 1000);
            },

            // 2. 管网听诊 (波形 + 多维数据)
            runLeak() {
                this.setStatus("多维感知中", "blue");
                this.log("接入 DMA 声学传感器...", "sys");
                let offset=0, flow=100, level=2.5;
                const loop = () => {
                    const ctx = this.ctx; offset+=2;
                    ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,this.width,this.height); this.drawGrid();

                    // 波形
                    ctx.strokeStyle='#10b981'; ctx.lineWidth=2; ctx.beginPath();
                    for(let x=0; x<this.width; x++) {
                        let y = this.height/2;
                        let noise = Math.sin((x+offset)*0.05)*10;
                        if(offset>200 && offset<500 && Math.abs(x-this.width/2)<50) {
                             noise += (Math.random()-0.5)*100; ctx.strokeStyle='#ef4444';
                        }
                        ctx.lineTo(x, y+noise);
                    }
                    ctx.stroke();

                    // SCADA 数据展示
                    ctx.fillStyle='#1e293b'; ctx.fillRect(20, this.height-80, 200, 60);
                    if(offset>200) { flow=100-(offset-200)*0.1; level=2.5-(offset-200)*0.005; }
                    ctx.fillStyle='#fff'; ctx.font="12px monospace";
                    ctx.fillText(`FLOW: ${flow.toFixed(1)} m³/h`, 30, this.height-60);
                    ctx.fillText(`LEVEL: ${level.toFixed(2)} m`, 30, this.height-40);

                    if(offset===210) this.log("流量计读数偏差...", "model");
                    if(offset===300) { this.log("多维研判：DN400供水管暗漏。", "alert"); this.setStatus("发现暗漏", "red"); }
                    this.updateData([{label:'流量',value:flow.toFixed(1)}, {label:'声学',value:offset>200?'异常':'正常', alert:offset>200}]);

                    if(offset<600) this.frameId=requestAnimationFrame(loop); else this.finishSimulation();
                }; loop();
            },

            // 3. 遥感天眼 (影像分析)
            runRemote() {
                this.log("加载高分二号影像...", "sys");
                let step=0;
                const loop = () => {
                    step++; const ctx=this.ctx; const w=this.width; const h=this.height;
                    ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,w,h);

                    // 左DEM 右NDVI
                    const mx=w/4, my=h/2, sx=w*0.75;
                    ctx.fillStyle='#334155'; ctx.fillRect(mx-80,my-80,160,160);
                    ctx.fillStyle='#1e3a8a'; ctx.beginPath(); ctx.arc(mx+20,my+10,30,0,Math.PI*2); ctx.fill(); // 低洼
                    ctx.fillStyle='#fff'; ctx.fillText("DEM高程", mx-70, my-60);

                    ctx.fillStyle='#334155'; ctx.fillRect(sx-80,my-80,160,160);
                    ctx.fillStyle='#10b981'; ctx.fillRect(sx-60,my-60,120,120); // 植被
                    if(step>50) { ctx.fillStyle='#9ca3af'; ctx.beginPath(); ctx.arc(sx+20,my+10,30,0,Math.PI*2); ctx.fill(); } // 缺失
                    ctx.fillStyle='#fff'; ctx.fillText("NDVI植被", sx-70, my-60);

                    if(step>100) { // 连线
                        ctx.strokeStyle='#fbbf24'; ctx.setLineDash([5,5]); ctx.beginPath(); ctx.moveTo(mx+20,my+10); ctx.lineTo(sx+20,my+10); ctx.stroke();
                        ctx.fillStyle='#fbbf24'; ctx.fillText("叠加分析", w/2-20, my);
                    }
                    if(step>150) {
                        ctx.strokeStyle='#ef4444'; ctx.lineWidth=3; ctx.setLineDash([]); ctx.strokeRect(sx-10,my-20,60,60);
                        this.setStatus("风险预测", "red");
                    }

                    if(step===60) this.log("NDVI指数急剧下降...", "model");
                    if(step===160) this.log("结论：植被破坏+低洼=高风险。", "alert");

                    if(step<250) this.frameId=requestAnimationFrame(loop); else this.finishSimulation();
                }; loop();
            },

            // 4. 社会感知 (聊天)
            runSocial() {
                const ol = document.getElementById('html-overlay');
                ol.classList.remove('hidden'); document.getElementById('sim-canvas').classList.add('hidden');
                ol.innerHTML = '';
                this.setStatus("监听中", "blue");

                const msgs = [
                    {t:500, u:'user', c:'【照片】奥体东门这里全是水，车过不去了！'},
                    {t:1500, u:'sys', c:'UrbanLLaVA 解析图像：道路积水(高风险)。'},
                    {t:2500, u:'ai', c:'收到。正在请求您的位置权限以精准派单...'},
                    {t:3500, u:'user', c:'【位置】建邺区江东中路'},
                    {t:4500, u:'sys', c:'LBS校准成功 (118.72, 32.00)'},
                    {t:5500, u:'ai', c:'已生成 #EM-992 工单，防汛队前往中。'}
                ];
                let i=0;
                const play = () => {
                    if(i>=msgs.length) { this.finishSimulation(); return; }
                    const m = msgs[i];
                    if(m.u==='sys') this.log(m.c, 'sys');
                    else {
                        const d = document.createElement('div');
                        d.className = `chat-bubble ${m.u==='user'?'chat-user':'chat-ai'}`;
                        d.innerText = m.c; ol.appendChild(d);
                    }
                    this.updateData([{label:'语义',value:i>2?'积水':'...'}, {label:'位置',value:i>3?'奥体':'...'}]);
                    i++; setTimeout(play, 1000);
                }; play();
            },

            // 5. 应急指挥 (网格避障)
            runDispatch() {
                this.log("生成风险热力图...", "sys");
                const gs=40; const rows=Math.floor(this.height/gs), cols=Math.floor(this.width/gs);
                const grid=[];
                for(let r=0;r<rows;r++) { grid[r]=[]; for(let c=0;c<cols;c++) grid[r][c]=(r>4&&r<8&&c>6&&c<12)?2:0; } // 2=障碍
                let agent={c:0,r:0}, target={c:cols-2,r:rows-2}, path=[];

                const loop = () => {
                    const ctx=this.ctx; ctx.clearRect(0,0,this.width,this.height);
                    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) {
                        ctx.fillStyle = grid[r][c]===2?'rgba(239,68,68,0.5)':'#0f172a';
                        ctx.fillRect(c*gs,r*gs,gs,gs); ctx.strokeStyle='#1e293b'; ctx.strokeRect(c*gs,r*gs,gs,gs);
                    }
                    ctx.fillStyle='#10b981'; ctx.fillRect(target.c*gs, target.r*gs, gs, gs);

                    // 简单移动
                    if(agent.c!=target.c || agent.r!=target.r) {
                        if(grid[agent.r][agent.c+1]!==2 && agent.c<target.c) agent.c++;
                        else if(agent.r<target.r) agent.r++;
                        path.push({...agent});
                    }

                    ctx.strokeStyle='#3b82f6'; ctx.lineWidth=3; ctx.beginPath();
                    path.forEach((p,i)=> { if(i===0) ctx.moveTo(p.c*gs+20,p.r*gs+20); else ctx.lineTo(p.c*gs+20,p.r*gs+20); });
                    ctx.stroke();
                    ctx.fillStyle='#3b82f6'; ctx.beginPath(); ctx.arc(agent.c*gs+20, agent.r*gs+20, 10, 0, Math.PI*2); ctx.fill();

                    this.updateData([{label:'坐标',value:`${agent.c},${agent.r}`}, {label:'状态',value:'避障中',alert:true}]);
                    if(path.length===1) this.log("MARL规划最优路径，规避积水...", "agent");
                    if(agent.c===target.c && agent.r===target.r) { this.log("抵达目标。", "sys"); this.finishSimulation(); }
                    else this.frameId = requestAnimationFrame(()=>setTimeout(loop, 100));
                }; loop();
            },

            // 6. 协同治理 (步骤连线)
            runCollab() {
                this.log("启动跨部门协同...", "sys");
                let step=0; const steps=["气象降雨","水务液位","交管路况","联合方案"];
                const loop = () => {
                    step++; const ctx=this.ctx; ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,this.width,this.height);
                    steps.forEach((txt,i) => {
                        const y = 80 + i*60; const active = step > i*50;
                        ctx.fillStyle = active?'#10b981':'#334155'; ctx.beginPath(); ctx.arc(this.width/2, y, 15, 0, Math.PI*2); ctx.fill();
                        if(i<3) { ctx.strokeStyle='#334155'; ctx.beginPath(); ctx.moveTo(this.width/2,y+15); ctx.lineTo(this.width/2, y+60-15); ctx.stroke(); }
                        ctx.fillStyle='#fff'; ctx.fillText(txt, this.width/2+30, y+5);
                        if(active && step===i*50+1) this.log(`执行：${txt}`, "agent");
                    });
                    if(step>200) { this.log("方案已下发。", "sys"); this.finishSimulation(); }
                    else this.frameId = requestAnimationFrame(loop);
                }; loop();
            },

            // 7. 孪生推演 (2.5D城市+管网) - 保持之前的版本
            runTwin() {
                this.log("加载 CIM 城市信息模型...", "sys");
                const ctx = this.ctx; const w = this.width; const h = this.height;
                let step = 0;
                const buildings = [{x:w*0.2, y:h*0.4, w:60, h:100}, {x:w*0.5, y:h*0.3, w:80, h:140}, {x:w*0.7, y:h*0.5, w:50, h:80}];
                const pipes = [{x:w*0.2+30, y:h*0.4+120, l:'J1'}, {x:w*0.5+40, y:h*0.3+160, l:'J2'}, {x:w*0.7+25, y:h*0.5+100, l:'J3'}];

                const loop = () => {
                    step++; ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,w,h);

                    // 地面
                    ctx.strokeStyle='#1e293b'; ctx.beginPath(); ctx.moveTo(0,h/2); ctx.lineTo(w,h/2); ctx.stroke();
                    // 建筑
                    ctx.fillStyle='#334155';
                    buildings.forEach(b => ctx.fillRect(b.x, b.y-b.h, b.w, b.h));

                    // 管网
                    if(step>30) {
                        ctx.strokeStyle='#3b82f6'; ctx.setLineDash([5,5]); ctx.beginPath(); ctx.moveTo(pipes[0].x, pipes[0].y);
                        pipes.forEach(p=>ctx.lineTo(p.x,p.y)); ctx.stroke();
                        pipes.forEach((p,i) => {
                            let val = 10 + (step>60?step*0.2:0);
                            ctx.fillStyle = val>50?'#ef4444':'#3b82f6';
                            ctx.beginPath(); ctx.arc(p.x,p.y,5,0,Math.PI*2); ctx.fill();
                            ctx.fillStyle='#fff'; ctx.fillText(p.l, p.x+10, p.y);
                        });
                    }

                    if(step===10) this.log("加载管网拓扑...", "sys");
                    if(step===60) this.log("暴雨情景推演...", "sys");
                    if(step>150) { this.log("J3 压力过载预警！", "alert"); this.setStatus("风险预警", "red"); }
                    if(step<250) this.frameId=requestAnimationFrame(loop); else this.finishSimulation();
                }; loop();
            },

            // 8. 能效控制 (Chart.js 交互)
            runEnergy() {
                const ctl = document.getElementById('controls-overlay');
                const cvs = document.getElementById('chart-container');
                document.getElementById('sim-canvas').classList.add('hidden');
                ctl.classList.remove('hidden'); cvs.classList.remove('hidden');

                this.setStatus("选择模式", "blue");
                ctl.innerHTML = `
                    <button onclick="sim.setMode('save')" class="bg-green-600 text-white px-3 py-1 rounded text-xs">🍃 节能</button>
                    <button onclick="sim.setMode('safe')" class="bg-blue-600 text-white px-3 py-1 rounded text-xs">🛡️ 安全</button>
                `;

                const ctx = document.getElementById('chart-canvas').getContext('2d');
                this.chartInstance = new Chart(ctx, {
                    type: 'bar',
                    data: { labels: ['泵1','泵2','泵3'], datasets: [{label:'能耗',data:[0,0,0],backgroundColor:'#3b82f6'}] },
                    options: { responsive:true, plugins:{title:{display:true,text:'控制策略'}} }
                });
            },
            setMode(m) {
                this.log(`切换模式: ${m}`, "agent");
                this.chartInstance.data.datasets[0].data = m==='save'?[40,20,0]:[80,80,60];
                this.chartInstance.update();
                this.updateData([{label:'模式',value:m==='save'?'节能':'安全'}, {label:'能耗',value:m==='save'?'60kW':'220kW'}]);
                setTimeout(()=>this.finishSimulation(), 1500);
            },

            // 9. 机器运维 (YOLO)
            runRobot() {
                this.log("CCTV入井...", "sys");
                let y=0; const ctx=this.ctx;
                const loop = () => {
                    y+=2; ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,this.width,this.height);
                    // 管道壁
                    const g=ctx.createRadialGradient(this.width/2,this.height/2,20,this.width/2,this.height/2,this.width/2);
                    g.addColorStop(0,'#1e293b'); g.addColorStop(1,'#0f172a'); ctx.fillStyle=g; ctx.fillRect(0,0,this.width,this.height);

                    ctx.strokeStyle='#10b981'; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(this.width,y); ctx.stroke();
                    if(y>150) {
                        ctx.strokeStyle='#ef4444'; ctx.strokeRect(this.width/2-40, this.height/2, 80, 50);
                        ctx.fillStyle='#ef4444'; ctx.fillText("裂缝 0.98", this.width/2-35, this.height/2+15);
                    }
                    if(y===150) { this.log("YOLOv12 发现裂缝", "alert"); this.setStatus("发现缺陷", "red"); }
                    this.updateData([{label:'距离',value:(y/10).toFixed(1)+'m'}, {label:'缺陷',value:y>150?'裂缝':'无',alert:y>150}]);
                    if(y<this.height) this.frameId=requestAnimationFrame(loop); else this.finishSimulation();
                }; loop();
            }
        };

        window.onload = () => app.init();
    </script>
</body>
