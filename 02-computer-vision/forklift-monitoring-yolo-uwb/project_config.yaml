# 统一运行配置
#
# mode 可选:
# - demo_uwb        离线 UWB 样例计数
# - demo_camera     摄像头检测 + 追踪 + 辅助计数
# - realtime_uwb    实时 UWB 路径计数

run:
  mode: demo_uwb
  site_config: config/site_example.yaml

visualization:
  enabled: true
  output_dir: output/visualization

uwb:
  input_type: csv
  input_path: data/sample_uwb_tracks.csv

camera:
  source: 0
  max_frames: 300

realtime_uwb:
  source_type: serial-line
  db_path: ""
  port: COM3
  baudrate: 115200
